# =============================================================================
# Barista Modal Submaps (optional)
# =============================================================================
# Load after the file that declares `leader` mode, e.g. at the end of skhdrc:
#   .load "/Users/<you>/.config/sketchybar/extras/skhd/barista_submaps.conf"
#
# Each mode shows its keys on the SketchyBar `shortcut_mode` item. Leaving a
# mode relies on your `:: default` hook to hide that item:
#   :: default : sketchybar --set shortcut_mode drawing=off label=""
#
# Entry keys avoid the existing leader bindings (a b f g j l m n q r t w 1-3).
# =============================================================================

:: emacs  @ : sketchybar --set shortcut_mode drawing=on label="EMACS  e here  g magit  d dired  c capture  s scratch" label.color=0xffcba6f7
:: files  @ : sketchybar --set shortcut_mode drawing=on label="FILES  f browse  w jump  s summon  t scratch-term" label.color=0xff89b4fa
:: win    @ : sketchybar --set shortcut_mode drawing=on label="WINDOW  m master  s monocle  tab stack  1-3 mark  ⇧1-3 set mark" label.color=0xfff9e2af
:: resize @ : sketchybar --set shortcut_mode drawing=on label="RESIZE  h/j/k/l size  = balance  0 rotate  esc done" label.color=0xfffab387

leader < e ; emacs
leader < o ; files
leader < s ; win
leader < z ; resize

emacs  < escape ; default
files  < escape ; default
win    < escape ; default
resize < escape ; default
resize < return ; default

emacs < e : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh emacs here
emacs < g : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh emacs magit
emacs < d : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh emacs dired
emacs < c : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh emacs capture
emacs < s : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh scratchpad toggle emacs

files < f : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh files browse
files < w : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh files windows jump
files < s : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh files windows summon
files < t : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh scratchpad toggle term

win < m : skhd -k "escape"; ~/.config/sketchybar/scripts/yabai_control.sh window-zoom-master
win < s : skhd -k "escape"; ~/.config/sketchybar/scripts/yabai_control.sh space-toggle-monocle
win < tab : skhd -k "escape"; ~/.config/sketchybar/scripts/yabai_control.sh window-stack-next
win < shift - tab : skhd -k "escape"; ~/.config/sketchybar/scripts/yabai_control.sh window-stack-prev
win < 1 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark focus 1
win < 2 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark focus 2
win < 3 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark focus 3
win < shift - 1 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark set 1
win < shift - 2 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark set 2
win < shift - 3 : skhd -k "escape"; ~/.config/sketchybar/scripts/barista_workflow.sh mark set 3

# Resize stays active so h/j/k/l can repeat without modifiers.
resize < h : ~/.config/sketchybar/scripts/yabai_control.sh window-resize west 40
resize < j : ~/.config/sketchybar/scripts/yabai_control.sh window-resize south 40
resize < k : ~/.config/sketchybar/scripts/yabai_control.sh window-resize north 40
resize < l : ~/.config/sketchybar/scripts/yabai_control.sh window-resize east 40
resize < 0x18 : ~/.config/sketchybar/scripts/yabai_control.sh balance
resize < 0 : ~/.config/sketchybar/scripts/yabai_control.sh space-rotate
